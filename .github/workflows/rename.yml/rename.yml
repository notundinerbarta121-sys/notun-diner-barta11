name: Rename uploaded file

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded file to index.html
        run: |
          if [ -f index-20261127-0300.html ]; then
            git mv index-20261127-0300.html index.html
            git config user.name "notundinerbarta121-sys"
            git config user.email "notundinerbarta121-sys@users.noreply.github.com"
            git commit -m "Rename uploaded file to index.html"
            git push
          else
            echo "No file to rename"
          fi
