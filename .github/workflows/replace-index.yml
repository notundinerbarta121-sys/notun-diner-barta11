name: Replace index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with new export
        run: cp index-20261126-0000.html index.html
      - name: Commit and push
        run: |
          git config user.name "notundinerbarta121-sys"
          git config user.email "notundinerbarta121@gmail.com"
          git add index.html
          git commit -m "Replace index.html: 26 Nov 2026 export" || echo "No changes to commit"
          git push
