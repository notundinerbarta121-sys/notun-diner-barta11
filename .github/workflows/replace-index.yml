name: Replace index.html

on:
  push:
    paths:
      - '.github/workflows/replace-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with uploaded file
        run: cp ntun-diner-baartaa.html index.html
      - name: Commit and push replacement
        run: |
          git config user.name "notundinerbarta121-sys"
          git config user.email "notundinerbarta121-sys@users.noreply.github.com"
          git add index.html
          git commit -m "Replace index.html with new version (25 Nov 2026)" || echo "No changes to commit"
          git push
