name: Replace index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html
        run: |
          cp index-20261126-1400.html index.html
          git config user.name "notundinerbarta121-sys"
          git config user.email "notundinerbarta121-sys@users.noreply.github.com"
          git add index.html
          git commit -m "Replace index.html with 20261126-1400 version" || echo "No changes to commit"
          git push
