name: Replace index.html

on:
  push:
    paths:
      - '.github/workflows/replace-index.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with the new version
        run: |
          cp index-20261127-0100.html index.html
          git config user.name "notundinerbarta121-sys"
          git config user.email "notundinerbarta121-sys@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Replace index.html with 20261127-0100 version"
          git push
